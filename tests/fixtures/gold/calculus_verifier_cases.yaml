# Hand-labelled verifier cases for the calculus domain.
#
# One case is one response to one item, and the verdict a person says it
# deserves. Four fields carry that, and two more are optional:
#
#   id                this case's own name. Referred to by the scorer's output
#                     and by the tests, so it must be unique and should stay
#                     stable — a renamed id silently orphans anything citing it.
#                     `gv_` for gold-verifier, then the item family, then what
#                     the response does: `gv_lim_unevaluated_quotient`.
#   item_id           which bank item the response is answering. This is a real
#                     id from domains/calculus/items/, not a label invented
#                     here: the scorer looks the item up and hands the verifier
#                     the *item*, so a case cannot drift away from the question
#                     it belongs to. It is also what makes `expected` needless —
#                     the right answer already lives on the item.
#   response          what the learner is imagined to have written, verbatim.
#   kind              the hand label. See below.
#   note              optional prose: why this case is here, or what it probes.
#                     For a reader, not for the scorer.
#   known_limitation  optional. See below.
#
# `kind` does two jobs at once, which is why there are four values and not a
# bare correct/incorrect flag. It names **the verdict the case asserts** and
# **the bucket the case is reported in**, so the scorer can say not just how
# often the verifier is right but how it is wrong:
#
#   canonical    the bank's own answer, verbatim              -> correct
#   equivalent   correct, written differently                 -> correct
#   wrong        a genuine mathematical error                 -> incorrect
#   unreadable   nothing mathematically decidable             -> unparseable
#
# The two failure directions have very different consequences, and splitting
# the buckets is what makes them separable:
#
#   a missed `equivalent`  is a **false negative** — a correct answer scored
#                          wrong. It charges the learner with an error they did
#                          not make, lowers the estimate and asks the diagnostic
#                          to explain something that never happened. The scorer
#                          further splits these by whether the verifier said
#                          INCORRECT (reached the learner model) or UNPARSEABLE
#                          (did not) — only the first does damage.
#   an accepted `wrong`    is a **false accept** — an error scored correct. It
#                          enters the learner model as evidence of knowing
#                          something, and nothing downstream can recover it.
#
# `canonical` is the floor: if those ever fail, the verifier cannot recognise
# the bank's own answers and nothing else in the set means anything.
#
# The set is deliberately weighted toward `equivalent`. Those are the cases a
# string-matching verifier fails and an equivalence verifier must pass, and a
# miss there charges the learner with an error they did not make.
#
# `known_limitation` states why the verifier is expected to disagree with the
# label today. Such cases stay in the set and stay counted; the scorer reports
# a disagreement nobody predicted and a prediction that no longer holds as two
# distinct failures, so the markers cannot rot in either direction.
#
# Labels are written from the mathematics, not from what the verifier returned.
cases:
  # --- limits ---------------------------------------------------------------
  - id: gv_lim_canonical
    item_id: ca_lim_p1
    response: "4"
    kind: canonical

  - id: gv_lim_unevaluated_quotient
    item_id: ca_lim_p1
    response: "8/2"
    kind: equivalent
    note: arithmetic left undone

  - id: gv_lim_decimal
    item_id: ca_lim_p1
    response: "4.0"
    kind: equivalent
    note: decimal for an integer

  - id: gv_lim_zero
    item_id: ca_lim_p1
    response: "0"
    kind: wrong
    note: the indeterminate form reported as zero

  - id: gv_lim_prose
    item_id: ca_lim_p1
    response: "the limit does not exist"
    kind: unreadable

  # --- average rate of change -----------------------------------------------
  - id: gv_avg_unsimplified
    item_id: ca_avg_p1
    response: "(9 - 1)/(3 - 1)"
    kind: equivalent
    note: the difference quotient left unevaluated

  - id: gv_avg_endpoint_difference
    item_id: ca_avg_p1
    response: "8"
    kind: wrong
    note: the change in y, not divided by the change in x

  # --- first principles -----------------------------------------------------
  - id: gv_fp_canonical
    item_id: ca_fp_p1
    response: "x**2 + 2*x*h + h**2"
    kind: canonical

  - id: gv_fp_student_notation
    item_id: ca_fp_p1
    response: "x^2 + 2xh + h^2"
    kind: equivalent
    note: caret and implicit multiplication

  - id: gv_fp_reordered
    item_id: ca_fp_p1
    response: "h**2 + 2*h*x + x**2"
    kind: equivalent

  - id: gv_fp_middle_term_lost
    item_id: ca_fp_p1
    response: "x**2 + h**2"
    kind: wrong

  - id: gv_fp_restates_the_question
    item_id: ca_fp_p1
    response: "(x + h)**2"
    kind: wrong
    note: the prompt asks for the expansion; nothing has been expanded
    known_limitation: >-
      This item asks for a rewrite, so its answer is a form rather than a value.
      An equivalence verifier cannot distinguish the two, and accepts the
      unexpanded input. The buggy rules never produce this response, so no
      simulated learner reaches it; a human-facing run would need the item
      reworded or a form-sensitive check.

  # --- power rule -----------------------------------------------------------
  - id: gv_pow_canonical
    item_id: ca_pow_p1
    response: "5*x**4"
    kind: canonical

  - id: gv_pow_student_notation
    item_id: ca_pow_p1
    response: "5x^4"
    kind: equivalent

  - id: gv_pow_commuted
    item_id: ca_pow_p1
    response: "x**4*5"
    kind: equivalent

  - id: gv_pow_repeated_factors
    item_id: ca_pow_p1
    response: "5*x*x*x*x"
    kind: equivalent

  - id: gv_pow_negative_exponent_form
    item_id: ca_pow_p1
    response: "5/x**(-4)"
    kind: equivalent
    note: division by a negative power

  - id: gv_pow_forgets_decrement
    item_id: ca_pow_p1
    response: "5*x**5"
    kind: wrong

  - id: gv_pow_drops_coefficient
    item_id: ca_pow_p1
    response: "x**4"
    kind: wrong

  - id: gv_pow_truncated
    item_id: ca_pow_p1
    response: "5x^"
    kind: unreadable

  - id: gv_pow2_factored_coefficient
    item_id: ca_pow_p2
    response: "3*4*x**2"
    kind: equivalent
    note: the coefficient left as the product that produced it

  - id: gv_pow2_repeated_factors
    item_id: ca_pow_p2
    response: "12*x*x"
    kind: equivalent

  - id: gv_pow2_forgets_decrement
    item_id: ca_pow_p2
    response: "12*x**3"
    kind: wrong

  - id: gv_pow_pretest_student_notation
    item_id: ca_pow_pre1
    response: "7x^6"
    kind: equivalent

  - id: gv_pow_pretest_forgets_decrement
    item_id: ca_pow_pre1
    response: "7*x**7"
    kind: wrong

  # --- negative and reciprocal powers ---------------------------------------
  - id: gv_neg_canonical
    item_id: ca_neg_p1
    response: "-4/x**3"
    kind: canonical

  - id: gv_neg_exponent_form
    item_id: ca_neg_p1
    response: "-4*x**(-3)"
    kind: equivalent

  - id: gv_neg_unreduced_fraction
    item_id: ca_neg_p1
    response: "-8/(2*x**3)"
    kind: equivalent

  - id: gv_neg_bracketed_sign
    item_id: ca_neg_p1
    response: "-(4/x^3)"
    kind: equivalent

  - id: gv_neg_sign_error
    item_id: ca_neg_p1
    response: "4/x**3"
    kind: wrong

  - id: gv_neg_exponent_not_decremented
    item_id: ca_neg_p1
    response: "-4/x**2"
    kind: wrong

  # --- polynomial differentiation -------------------------------------------
  - id: gv_poly_canonical
    item_id: ca_poly_p1
    response: "3*x**2 - 6*x"
    kind: canonical

  - id: gv_poly_factored
    item_id: ca_poly_p1
    response: "3*x*(x - 2)"
    kind: equivalent

  - id: gv_poly_reordered
    item_id: ca_poly_p1
    response: "-6*x + 3*x**2"
    kind: equivalent

  - id: gv_poly_constant_survives
    item_id: ca_poly_p1
    response: "3*x**2 - 6*x + 4"
    kind: wrong
    note: the constant term carried through undifferentiated

  - id: gv_poly_coefficient_error
    item_id: ca_poly_p1
    response: "3*x**2 - 3*x"
    kind: wrong

  - id: gv_poly_garbled
    item_id: ca_poly_p1
    response: "2 **/ x"
    kind: unreadable

  # --- stationary points (solution sets) ------------------------------------
  - id: gv_stat_canonical
    item_id: ca_stat_p1
    response: "0, 2"
    kind: canonical

  - id: gv_stat_reordered
    item_id: ca_stat_p1
    response: "2, 0"
    kind: equivalent
    note: the question asks for all roots, so order carries no meaning

  - id: gv_stat_unreduced
    item_id: ca_stat_p1
    response: "0, 4/2"
    kind: equivalent

  - id: gv_stat_cancels_x
    item_id: ca_stat_p1
    response: "2"
    kind: wrong
    note: dividing through by x discards the root at zero

  - id: gv_stat_extra_root
    item_id: ca_stat_p1
    response: "0, 2, 5"
    kind: wrong

  - id: gv_stat_relation
    item_id: ca_stat_p1
    response: "x > 2"
    kind: unreadable
    note: a relation is not an expression

  - id: gv_stat_written_as_equations
    item_id: ca_stat_p1
    response: "x = 0 or x = 2"
    kind: equivalent
    note: both roots, stated as equations
    known_limitation: >-
      The parser reads expressions, so an equation or a prose connective comes
      back unparseable. The failure is the safe direction — no evidence is
      recorded and the learner is not charged with an error — but the step is
      wasted.

  # --- product rule ---------------------------------------------------------
  - id: gv_prod_canonical
    item_id: ca_prod_p1
    response: "2*x*(x**3 + 2) + (x**2 + 1)*3*x**2"
    kind: canonical

  - id: gv_prod_expanded
    item_id: ca_prod_p1
    response: "5*x**4 + 3*x**2 + 4*x"
    kind: equivalent
    note: multiplied out, which is what most students hand in

  - id: gv_prod_reordered
    item_id: ca_prod_p1
    response: "3*x**2*(x**2 + 1) + 2*x*(x**3 + 2)"
    kind: equivalent

  - id: gv_prod_product_of_derivatives
    item_id: ca_prod_p1
    response: "2*x*3*x**2"
    kind: wrong

  - id: gv_prod_sign_error
    item_id: ca_prod_p1
    response: "2*x*(x**3 + 2) - (x**2 + 1)*3*x**2"
    kind: wrong

  - id: gv_prod_prose
    item_id: ca_prod_p1
    response: "no idea"
    kind: unreadable
    note: implicit multiplication would otherwise read this as a product

  # --- quotient rule --------------------------------------------------------
  - id: gv_quot_canonical
    item_id: ca_quot_p1
    response: "(2*x*(x + 1) - x**2)/(x + 1)**2"
    kind: canonical

  - id: gv_quot_numerator_expanded
    item_id: ca_quot_p1
    response: "(x**2 + 2*x)/(x + 1)**2"
    kind: equivalent
    note: the numerator collected

  - id: gv_quot_numerator_factored
    item_id: ca_quot_p1
    response: "x*(x + 2)/(x + 1)**2"
    kind: equivalent

  - id: gv_quot_order_swapped
    item_id: ca_quot_p1
    response: "(x**2 - 2*x*(x + 1))/(x + 1)**2"
    kind: wrong

  - id: gv_quot_derivative_over_derivative
    item_id: ca_quot_p1
    response: "2*x"
    kind: wrong
    note: numerator and denominator differentiated separately

  - id: gv_quot_posttest_collected
    item_id: ca_quot_post1
    response: "(x**2 + 6*x)/(x + 3)**2"
    kind: equivalent

  # --- chain rule -----------------------------------------------------------
  - id: gv_chain_canonical
    item_id: ca_chain_p1
    response: "6*x*(x**2 + 1)**2"
    kind: canonical

  - id: gv_chain_student_notation
    item_id: ca_chain_p1
    response: "3*(x^2 + 1)^2*2x"
    kind: equivalent
    note: the chain rule written as it is applied, before tidying

  - id: gv_chain_expanded
    item_id: ca_chain_p1
    response: "6*x**5 + 12*x**3 + 6*x"
    kind: equivalent

  - id: gv_chain_repeated_factor
    item_id: ca_chain_p1
    response: "6*x*(x*x + 1)**2"
    kind: equivalent

  - id: gv_chain_omits_inner
    item_id: ca_chain_p1
    response: "3*(x**2 + 1)**2"
    kind: wrong

  - id: gv_chain_inner_not_squared
    item_id: ca_chain_p1
    response: "6*x*(x**2 + 1)"
    kind: wrong

  - id: gv_chain_apostrophe
    item_id: ca_chain_p1
    response: "I don't know"
    kind: unreadable

  - id: gv_chain2_unmultiplied
    item_id: ca_chain_p2
    response: "4*(3*x + 1)**3*3"
    kind: equivalent
    note: the two factors left unmultiplied

  - id: gv_chain2_expanded
    item_id: ca_chain_p2
    response: "324*x**3 + 324*x**2 + 108*x + 12"
    kind: equivalent
    note: expanded rather than left in the bracketed form

  - id: gv_chain2_omits_inner
    item_id: ca_chain_p2
    response: "4*(3*x + 1)**3"
    kind: wrong

  # --- implicit differentiation ---------------------------------------------
  - id: gv_impl_canonical
    item_id: ca_impl_p1
    response: "-x/y"
    kind: canonical

  - id: gv_impl_unreduced
    item_id: ca_impl_p1
    response: "-2*x/(2*y)"
    kind: equivalent
    note: the form the rearrangement produces, before cancelling

  - id: gv_impl_sign_on_denominator
    item_id: ca_impl_p1
    response: "x/(-y)"
    kind: equivalent

  - id: gv_impl_omits_dydx
    item_id: ca_impl_p1
    response: "-x"
    kind: wrong

  - id: gv_impl_sign_error
    item_id: ca_impl_p1
    response: "x/y"
    kind: wrong

  - id: gv_impl_ambiguous_denominator
    item_id: ca_impl_p1
    response: "-x/1y"
    kind: unreadable
    note: >-
      The ambiguity a person hit at the keyboard, on the variant whose answer is
      -x/(3y): they wrote -x/3y, meant the whole product as the denominator, and
      were told they were wrong three times. Formal precedence reads a/bc as
      (a/b)*c and ordinary mathematical writing reads a/(bc); neither is wrong,
      so the verifier cannot say what was demonstrated and must not guess. The
      denominator here is 1y rather than 3y because this case is written against
      the item as the bank states it.

  - id: gv_impl_ambiguity_that_does_not_matter
    item_id: ca_impl_p1
    response: "-x/1y**2"
    kind: wrong
    note: >-
      Wrong under both readings, so the notation is not the reason and the
      verdict stands. This is the boundary of the case above: ambiguity is only
      reported when it decides the verdict.

  - id: gv_impl_explicit_multiplication_is_not_ambiguous
    item_id: ca_impl_p1
    response: "-x/1*y"
    kind: wrong
    note: >-
      An explicit product after the division has one reading, and it is
      (-x/1)*y. Nothing is rescued here — a learner who wrote this wrote
      something else.

  - id: gv_impl_written_as_equation
    item_id: ca_impl_p1
    response: "dy/dx = -x/y"
    kind: equivalent
    note: the answer restated as the equation the question asks for
    known_limitation: >-
      Same cause as gv_stat_written_as_equations: the parser reads one
      expression, and an equals sign is a syntax error. Unparseable rather than
      wrong, so nothing false enters the learner model.

  - id: gv_impl_posttest_omits_dydx
    item_id: ca_impl_post1
    response: "-x"
    kind: wrong

  # --- antiderivatives ------------------------------------------------------
  - id: gv_anti_canonical
    item_id: ca_anti_p1
    response: "x**3 + C"
    kind: canonical

  - id: gv_anti_constant_first
    item_id: ca_anti_p1
    response: "C + x**3"
    kind: equivalent

  - id: gv_anti_repeated_factors
    item_id: ca_anti_p1
    response: "x*x*x + C"
    kind: equivalent

  - id: gv_anti_lowercase_constant
    item_id: ca_anti_p1
    response: "x**3 + c"
    kind: equivalent
    note: the constant of integration written in lower case

  - id: gv_anti_omits_constant
    item_id: ca_anti_p1
    response: "x**3"
    kind: wrong

  - id: gv_anti_divides_instead
    item_id: ca_anti_p1
    response: "x**3/3 + C"
    kind: wrong

  - id: gv_anti_posttest_constant_first
    item_id: ca_anti_post1
    response: "C + x**5"
    kind: equivalent

  # --- integration by substitution ------------------------------------------
  - id: gv_usub_canonical
    item_id: ca_usub_p1
    response: "(2*x + 1)**4/8"
    kind: canonical

  - id: gv_usub_decimal_coefficient
    item_id: ca_usub_p1
    response: "0.125*(2*x + 1)**4"
    kind: equivalent

  - id: gv_usub_expanded_with_constant
    item_id: ca_usub_p1
    response: "2*x**4 + 4*x**3 + 3*x**2 + x + 1/8"
    kind: equivalent
    note: multiplied out, carrying the 1/8 that (2x + 1)^4/8 contains

  - id: gv_usub_expanded_constant_dropped
    item_id: ca_usub_p1
    response: "2*x**4 + 4*x**3 + 3*x**2 + x"
    kind: equivalent
    note: >-
      the same antiderivative, differing only by the constant 1/8 that
      (2x + 1)^4/8 hides. The item opts into up_to_constant, so the verifier
      compares derivatives and accepts it.

  - id: gv_usub_forgets_du
    item_id: ca_usub_p1
    response: "(2*x + 1)**4/4"
    kind: wrong

  - id: gv_usub_sign_error
    item_id: ca_usub_p1
    response: "-(2*x + 1)**4/8"
    kind: wrong

  - id: gv_usub_posttest_expanded
    item_id: ca_usub_post1
    response: "16*x**4 + 16*x**3 + 6*x**2 + x + 1/16"
    kind: equivalent
    note: (4x + 1)^4/16 multiplied out, constant included

  - id: gv_usub_empty
    item_id: ca_usub_p1
    response: ""
    kind: unreadable
