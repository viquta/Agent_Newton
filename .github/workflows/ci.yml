name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install
        run: uv sync --all-extras --dev

      # Config in [tool.pyright]. Errors fail the build; warnings do not, so a
      # third-party package shipping no stubs cannot block a merge.
      - name: Type check
        run: uv run pyright

      # Excludes tests marked `slow` — those invoke a real model or run a
      # cohort, and neither belongs in CI. Everything else, including the full
      # zero-LLM end-to-end run, is expected to pass here.
      - name: Test
        run: uv run pytest -m "not slow" -q
