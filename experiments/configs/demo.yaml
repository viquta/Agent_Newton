# Human-in-the-loop session. One person, answering at the keyboard.
#
# The diagnostic must be model-backed: a person carries no injected
# misconception label, so an oracle would have nothing to read and would
# diagnose nothing on every step. The config validator rejects that rather than
# letting the session run and look fine.
#
# `think: false` because gemma4 is a reasoning model — left to deliberate it can
# spend its whole token budget before answering, which at a keyboard is a wait
# rather than a line in a log.
run_name: demo
domain: calculus
arm: coupled
seed: 20260812

cohort:
  n_learners: 1
  # Short by design: this is a sitting at a keyboard, not a cohort run. Raised
  # from 12 so that more of the sitting is the tutoring being evaluated and
  # less of it is measurement.
  max_items: 20
  max_steps_per_item: 3
  # Kept on, so the sitting yields a real pre-to-post measurement. It adds the
  # two held-out banks either side of the practice items — set it false for a
  # shorter demonstration, at the cost of the gain figure.
  administer_tests: true
  # On here and nowhere else. A person who has just answered fifteen questions
  # expects them to count for something, and the training now starts from what
  # the pre-test showed. It stays off for cohorts because it moves the starting
  # frontier, which only the coupled arm can route from — see CohortConfig.
  seed_from_pretest: true
  # Three observations' worth, which is what it takes for one correct unaided
  # answer to clear theta_upper and skip the concept. At 1 a sitting spent 21 of
  # its 24 training steps re-proving concepts the pre-test had already shown,
  # and never reached five of the six real gaps.
  pretest_weight: 3
  # The lowest a seeded estimate may land. Without it, weighting the evidence
  # up also drove every missed concept to about 0.0003 — below theta_lower/2,
  # where the scaffolding rule gives a worked step on the first attempt. A
  # sitting spent 41 steps that way and never saw a nudge or a targeted hint.
  #
  # At 0.40 the concept is still far below theta_upper, so it stays selectable
  # and still ranks first under consolidate, but support now starts at
  # `targeted` and escalates to `worked_step` on failure — which is the ladder
  # the band was there to provide. It must stay under theta_lower (0.70) or a
  # wrong pre-test answer would unlock the material behind it; the config
  # refuses that.
  seed_floor: 0.40

simulator:
  learner: human
  surface: symbolic

agents:
  # A real tutor, not canned strings. The cohorts keep this model-free
  # because only the diagnostic is measured; a person reading the words is
  # a different requirement.
  tutor:      { impl: llm, provider: ollama, model: gemma4:12b, think: false }
  diagnostic: { impl: llm, provider: ollama, model: gemma4:12b, think: false }
  planner:    { impl: goal_directed, emphasis: consolidate }

bkt:
  p_init: 0.15
  p_transit: 0.20
  p_guess: 0.20
  p_slip: 0.10

zpd:
  theta_lower: 0.70
  theta_upper: 0.90

# What a gap between sittings does to the model's belief. Off by default and off
# for every cohort — a single-session run must behave exactly as it did before
# sequences existed. On here because the demo is where coming back is the point.
#
# Two weeks halves the distance from a posterior to the prior, so a concept left
# at 0.96 reads about 0.55 a month later and has fallen back into the frontier:
# it will be offered again. Nothing schedules that review — the estimate simply
# went stale and the route passes through it once more.
decay:
  half_life_days: 14.0

arbitration:
  theta: 0.15
  k_repeats: 2
  min_items_between_replans: 2
  error_trace_length: 20
