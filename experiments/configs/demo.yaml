# Human-in-the-loop session. One person, answering at the keyboard.
#
# The diagnostic must be model-backed: a person carries no injected
# misconception label, so an oracle would have nothing to read and would
# diagnose nothing on every step. The config validator rejects that rather than
# letting the session run and look fine.
#
# `think: false` because gemma4 is a reasoning model — left to deliberate it can
# spend its whole token budget before answering, which at a keyboard is a wait
# rather than a line in a log.
run_name: demo
domain: calculus
arm: coupled
seed: 20260812

cohort:
  n_learners: 1
  # Short by design: this is a sitting at a keyboard, not a cohort run.
  #
  # Cut from 20. Twenty practice items plus two fifteen-item banks ran two hours
  # and the person answering said what that costs: "at some point I will tire
  # out... it is very tiring". A measurement taken from someone who is tired is
  # a worse measurement, so this is not only a comfort. Ten is the top of the
  # range asked for, and with the banks below now short on a return the whole
  # sitting is roughly a third of what it was.
  max_items: 10
  max_steps_per_item: 3
  # Steps the verifier could not read, per item, before moving on. They cost no
  # attempt — nothing about the learner was measured — so something has to stop
  # an empty answer from being asked for indefinitely.
  max_unreadable_per_item: 3
  # Kept on, so the sitting yields a real pre-to-post measurement. It adds the
  # two held-out banks either side of the practice items — set it false for a
  # shorter demonstration, at the cost of the gain figure.
  administer_tests: true
  # On here and nowhere else. A first sitting still sits the whole bank, because
  # there is no history to narrow against and the baseline is what everything
  # after it is read against. Every sitting after that re-checks only the
  # concepts still on the way to the next goal, at both ends.
  #
  # The alternative that was in place — the same fixed fifteen items every
  # sitting — was asked about twice unprompted ("is the pre-test only going to
  # be in the first session? I hope so"), and it has a measurement problem
  # besides the tedium: familiarity accumulates on exactly the items the outcome
  # is read from. Running it once only is worse still, since it never measures
  # what a gap between sittings has cost.
  #
  # It must stay `full` for every cohort. The banks are the instrument, and an
  # arm that sat a different one is not comparable.
  pretest_scope: route
  # On here and nowhere else. A person who has just answered fifteen questions
  # expects them to count for something, and the training now starts from what
  # the pre-test showed. It stays off for cohorts because it moves the starting
  # frontier, which only the coupled arm can route from — see CohortConfig.
  seed_from_pretest: true
  # Three observations' worth, which is what it takes for one correct unaided
  # answer to clear theta_upper and skip the concept. At 1 a sitting spent 21 of
  # its 24 training steps re-proving concepts the pre-test had already shown,
  # and never reached five of the six real gaps.
  pretest_weight: 3
  # The lowest a seeded estimate may land. Without it, weighting the evidence
  # up also drove every missed concept to about 0.0003 — below theta_lower/2,
  # where the scaffolding rule gives a worked step on the first attempt. A
  # sitting spent 41 steps that way and never saw a nudge or a targeted hint.
  #
  # At 0.40 the concept is still far below theta_upper, so it stays selectable
  # and still ranks first under consolidate, but support now starts at
  # `targeted` and escalates to `worked_step` on failure — which is the ladder
  # the band was there to provide. It must stay under theta_lower (0.70) or a
  # wrong pre-test answer would unlock the material behind it; the config
  # refuses that.
  seed_floor: 0.40
  # On here and nowhere else. Asking for a concept the model already calls
  # mastered reopens it for revision instead of being declined.
  #
  # The reason a request may do what an inference may not: a sitting ended with
  # three concepts above theta_upper that the held-out post-test showed the
  # learner could not do, and until the seeding was capped one correct pre-test
  # answer landed near 0.96 on its own. Refusing an explicit request on the
  # strength of that number defers to the least reliable thing on the board.
  # Working the concept is then the check the estimate has been owed.
  #
  # Prerequisites are still never skipped — only the upper bound gives way.
  review_on_request: true

simulator:
  learner: human
  surface: symbolic

agents:
  # A real tutor, not canned strings. The cohorts keep this model-free
  # because only the diagnostic is measured; a person reading the words is
  # a different requirement.
  tutor:      { impl: llm, provider: ollama, model: gemma4:12b, think: false }
  diagnostic: { impl: llm, provider: ollama, model: gemma4:12b, think: false }
  planner:    { impl: goal_directed, emphasis: consolidate }

bkt:
  p_init: 0.15
  p_transit: 0.20
  p_guess: 0.20
  p_slip: 0.10
  # On here and nowhere else. Failing a concept twice charges a quarter of one
  # wrong answer back to each immediate prerequisite the model calls mastered.
  #
  # A sitting is what asked for it: three failures on integration by
  # substitution while chain rule sat at 0.952 and antiderivatives at 0.911 —
  # both past theta_upper, so neither could be offered again, and neither moved.
  # At 0.25 they land at 0.892 and 0.824 and both come back into the frontier,
  # so the route passes through the basics again.
  #
  # A starting point, not a measured value. Lower and only the weaker of the two
  # reopens; higher and one bad patch undoes a lot of standing belief. Judge it
  # from a sitting.
  #
  # It must stay 0.0 for every cohort: only the coupled arm could do this, so a
  # cohort running it would separate the arms by construction.
  prerequisite_doubt: 0.25

zpd:
  theta_lower: 0.70
  theta_upper: 0.90

# On here and nowhere else. After three recorded errors on one concept the
# system explains what the concept *is*, rather than commenting on another
# failed attempt at it.
#
# The gap it closes: every other instructional move is a reply to a step, so a
# learner who has never met a concept and one who holds a misconception about it
# were answered identically. A sitting recorded the cost — someone asked what
# sin(x) was three times, in three channels, and was told about the product rule
# each time, because that was all there was to tell them.
#
# Three is a threshold rather than a measurement. Below it a learner is taught
# after a slip; above it they spend a sitting failing something nobody explained.
# Judge it from a sitting.
#
# `:why` asks for one directly and bypasses the count — someone saying they do
# not know what this is, is better evidence of that than three wrong answers.
#
# It must stay 0 for every cohort. Nothing here can move a cohort number today
# (a lesson targets a concept, and the simulated learner improves only through
# `receive_hint`), but that is a fact about this simulator rather than about the
# design, and a scan over this directory refuses anything else.
teaching:
  explain_after: 3
  # A lesson is a conversation, not a wall of text. The tutor says a little and
  # asks; you answer; it takes up what you said and asks the next thing. **You**
  # end it — a blank line or :done, whenever you have had enough. This number is
  # only so a conversation cannot run on unattended.
  #
  # ⚠️ It was 3, then 12, and a sitting reached both. The first took someone out
  # who was "just about to understand something important"; the second cut in
  # mid-derivation, with the tutor having just asked them to expand (x + h)^2.
  #
  # `null` is unbounded, and that is what a person should have. The runaway this
  # was guarding against cannot happen: a turn needs a reply and a reply needs
  # someone to type one, so the conversation already stops the moment you stop.
  # You end it, with a blank line or :done.
  #
  # The tutor may notice you have got it and say you can stop — but only say it.
  # Nothing reads that back, and the loop asks you every turn regardless.
  #
  # It closes with the written account either way, so leaving early never costs
  # you the explanation. That account is the authored text: checked as plain
  # text, and checked not to answer any question in any bank at any draw. The
  # conversation above it is the model's and is checked against nothing, which
  # is why the thing you keep is the one a person wrote.
  #
  # The first version of this was one shot and read as a monologue — the model
  # asked questions and answered them itself, because the instruction told it
  # to. A sitting said so: "I really thought that would be more of a dialogue
  # between me and the Tutor."
  #
  # ⚠️ Costs up to four model calls per lesson at 15-27s each. If the talking
  # starts outstaying its welcome, this is the dial. It must stay 0 for every
  # cohort — and a simulated learner cannot converse anyway, so a dialogue is
  # unreachable there whatever this says.
  lesson_turns: null
  # On here and nowhere else. Reads what you write in the working and reflection
  # channels for "I do not know what this concept is", and offers the lesson
  # without your having to ask for it.
  #
  # A sitting is what asked for this. Someone wrote "I factored the denominator
  # with part of the nominator (x^2 - 9) = (x+3)(x-3). But I don't understand
  # what a limit is" — and then still had to type :why, for something the system
  # was already holding, in the channel that already captures it.
  #
  # ⚠️ It decides nothing instructional. It records that you said something, on
  # the same path :why uses; whether a lesson happens, which account it takes
  # and when it stops are all still rules. The one difference from asking
  # outright is the ceiling: asking again is always honoured, and an inference
  # is not, or a detector firing repeatedly would cycle the same three accounts
  # round and round.
  #
  # It needs a model-backed tutor to read with, and the config refuses it
  # otherwise rather than running with a detector that says no to everything and
  # reporting the feature as on. Cohorts run `tutor.impl: template`, so it
  # cannot exist there — and a simulated learner writes nothing in either
  # channel, so there would be nothing to read either way.
  detect_confusion: true

# On here and nowhere else, both of them.
#
# `banded_plus` reads every cut point off the band above. Above theta_upper
# nothing is disclosed; inside the band escalation stops at `targeted`, so
# failing twice on a concept the model believes is nearly there no longer hands
# over the step; below theta_lower the two original levels remain.
#
# `offer_at_presentation` shows the rule beside the question for a concept below
# theta_lower, and a solved example on other numbers further down. Support stops
# being purely reactive: help arrives with the problem rather than only after
# the learner has already got it wrong.
#
# Both stay off for every cohort. Nothing here can move a cohort number — the
# simulated learner improves only through `receive_hint` — but that is a fact
# about today's simulator rather than about the design, and a scan over this
# directory refuses either knob in an experiment config.
scaffolding:
  policy: banded_plus
  offer_at_presentation: true

# What a gap between sittings does to the model's belief. Off by default and off
# for every cohort — a single-session run must behave exactly as it did before
# sequences existed. On here because the demo is where coming back is the point.
#
# Two weeks halves the distance from a posterior to the prior, so a concept left
# at 0.96 reads about 0.55 a month later and has fallen back into the frontier:
# it will be offered again. Nothing schedules that review — the estimate simply
# went stale and the route passes through it once more.
decay:
  half_life_days: 14.0

arbitration:
  theta: 0.15
  k_repeats: 2
  min_items_between_replans: 2
  error_trace_length: 20
