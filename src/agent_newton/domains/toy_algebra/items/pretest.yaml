# Pre-test bank. Held out from practice, administered without hints.
#
# Together with posttest.yaml this gives the pre->post gain score. Every
# misconception must be probed here AND in the post-test, or its remediation
# rate is not measurable — the validator checks both directions.
items:
  - id: ta_int_pre1
    concept_id: integer_arithmetic
    bank: pretest
    prompt: "Compute: 9 + 4"
    answer: "13"

  - id: ta_eval_pre1
    concept_id: evaluate_expression
    bank: pretest
    prompt: "Evaluate 3x + 2 when x = 3"
    answer: "11"

  - id: ta_clt_pre1
    concept_id: combine_like_terms
    bank: pretest
    prompt: "Simplify: 6x + 1"
    answer: "6x + 1"
    probes: [combine_unlike_terms]
    params: { a: 6, c: 1 }

  - id: ta_dist_pre1
    concept_id: distribute
    bank: pretest
    prompt: "Expand: 4(x + 3)"
    answer: "4x + 12"
    probes: [distribute_first_term_only]
    params: { a: 4, c: 3 }

  - id: ta_solve_pre1
    concept_id: solve_linear
    bank: pretest
    prompt: "Solve for x: x + 2 = 9"
    answer: "7"
    probes: [sign_error_moving_term]
    params: { form: add, c: 2, rhs: 9 }

  - id: ta_solve_pre2
    concept_id: solve_linear
    bank: pretest
    prompt: "Solve for x: 5x = 15"
    answer: "3"
    probes: [drop_coefficient_when_solving]
    params: { form: mul, a: 5, rhs: 15 }
