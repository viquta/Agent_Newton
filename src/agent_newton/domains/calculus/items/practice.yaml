# Practice items. Disjoint from the pre-test and post-test banks.
#
# `params` is the structured form buggy rules compute against, so no rule has to
# parse `prompt`. Answers are written in sympy notation; the verifier compares
# by equivalence, so a learner may write them in any equivalent form.
items:
  # --- limits_of_sequences ------------------------------------------------
  - id: ca_lim_p1
    concept_id: limits_of_sequences
    prompt: "Evaluate: lim(x -> 2) of (x^2 - 4)/(x - 2)"
    answer: "4"
    probes: [indeterminate_limit_reported_as_zero]
    params: { indeterminate: true }

  - id: ca_lim_p2
    concept_id: limits_of_sequences
    prompt: "Evaluate: lim(x -> 1) of (x^2 + 3)"
    answer: "4"

  # --- average_rate_of_change ---------------------------------------------
  - id: ca_avg_p1
    concept_id: average_rate_of_change
    prompt: "For y = x^2, find the average rate of change from x = 1 to x = 3."
    answer: "4"
    probes: [rate_as_difference_not_ratio]
    # f(3) - f(1) = 9 - 1, never divided by 3 - 1.
    params: { difference: 8 }

  # --- limit_concept ------------------------------------------------------
  # P and Q were named here without ever being defined, and a person said so:
  # "the hint did not explain what Q and P were. It was very confusing." An
  # item may not depend on notation it does not introduce.
  - id: ca_tan_p1
    concept_id: limit_concept
    prompt: >-
      The tangent to y = x^2 at x = 2 is the limit of the gradients of the
      secants joining that point to a nearby point on the curve, as the nearby
      point approaches it. Find the tangent's gradient.
    answer: "4"
    probes: [tangent_as_secant]
    # The secant from x = 2 to x = 3: (9 - 4)/1. The limit is never taken.
    params: { secant_gradient: 5 }

  # --- instantaneous_rate_of_change ---------------------------------------
  - id: ca_inst_p1
    concept_id: instantaneous_rate_of_change
    prompt: "For y = x^2, find the instantaneous rate of change at x = 3."
    answer: "6"
    probes: [average_for_instantaneous_rate]
    params: { average_rate: 7 }

  # --- derivative_from_first_principles -----------------------------------
  - id: ca_fp_p1
    concept_id: derivative_from_first_principles
    prompt: "Expand (x + h)^2."
    answer: "x**2 + 2*x*h + h**2"
    probes: [binomial_middle_term_lost]
    params: { base: "x", step: "h", exponent: 2 }

  # --- power_rule ---------------------------------------------------------
  - id: ca_pow_p1
    concept_id: power_rule
    prompt: "Differentiate: y = x^5"
    answer: "5*x**4"
    probes: [power_rule_forgets_decrement]
    params: { coefficient: 1, exponent: 5 }

  - id: ca_pow_p2
    concept_id: power_rule
    prompt: "Differentiate: y = 4x^3"
    answer: "12*x**2"
    probes: [power_rule_forgets_decrement]
    params: { coefficient: 4, exponent: 3 }

  # --- negative_fractional_exponents --------------------------------------
  - id: ca_neg_p1
    concept_id: negative_fractional_exponents
    prompt: "Differentiate: y = 2/x^2"
    answer: "-4/x**3"
    probes: [reciprocal_power_not_rewritten]
    params: { coefficient: 2, exponent: 2 }

  # --- polynomial_differentiation -----------------------------------------
  - id: ca_poly_p1
    concept_id: polynomial_differentiation
    prompt: "Differentiate: y = x^3 - 3x^2 + 4"
    answer: "3*x**2 - 6*x"
    probes: [constant_term_differentiated]
    params: { constant: 4 }

  # --- stationary_points --------------------------------------------------
  - id: ca_stat_p1
    concept_id: stationary_points
    prompt: "Solve 3x^2 - 6x = 0. Give all solutions."
    answer: "0, 2"
    probes: [cancel_x_loses_root]
    params: { nonzero_root: 2 }

  # --- product_rule -------------------------------------------------------
  # Polynomials, not trig. A learner met y = x^2 sin(x) here and asked three
  # times what sin(x) was; nothing in the graph teaches it, so the planner could
  # not route to their actual gap and the tutor could only keep explaining the
  # product rule. An item must not depend on knowledge the graph does not
  # contain — there is a test on it.
  - id: ca_prod_p1
    concept_id: product_rule
    prompt: "Differentiate: y = (x^2 + 1)(x^3 + 2)"
    answer: "2*x*(x**3 + 2) + (x**2 + 1)*3*x**2"
    probes: [product_rule_as_product_of_derivatives]
    params: { f: "x**2 + 1", g: "x**3 + 2", df: "2*x", dg: "3*x**2" }

  # --- quotient_rule ------------------------------------------------------
  - id: ca_quot_p1
    concept_id: quotient_rule
    prompt: "Differentiate: y = x^2/(x + 1)"
    answer: "(2*x*(x + 1) - x**2)/(x + 1)**2"
    probes: [quotient_rule_order_swapped]
    params: { f: "x**2", g: "x + 1", df: "2*x", dg: "1" }

  # --- chain_rule ---------------------------------------------------------
  - id: ca_chain_p1
    concept_id: chain_rule
    prompt: "Differentiate: y = (x^2 + 1)^3"
    answer: "6*x*(x**2 + 1)**2"
    probes: [chain_rule_omits_inner]
    params: { outer_derivative: "3*(x**2 + 1)**2" }

  - id: ca_chain_p2
    concept_id: chain_rule
    prompt: "Differentiate: y = (3x + 1)^4"
    answer: "12*(3*x + 1)**3"
    probes: [chain_rule_omits_inner]
    params: { outer_derivative: "4*(3*x + 1)**3" }

  # --- implicit_differentiation -------------------------------------------
  - id: ca_impl_p1
    concept_id: implicit_differentiation
    prompt: "Given x^2 + y^2 = 25, find dy/dx."
    answer: "-x/y"
    probes: [implicit_diff_omits_dydx]
    params: { without_dydx: "-x" }

  # --- antiderivative -----------------------------------------------------
  - id: ca_anti_p1
    concept_id: antiderivative
    prompt: "Find the general antiderivative of 3x^2."
    answer: "x**3 + C"
    probes: [antiderivative_omits_constant]
    params: { particular: "x**3" }

  # --- integration_by_substitution ----------------------------------------
  - id: ca_usub_p1
    concept_id: integration_by_substitution
    prompt: "Integrate (2x + 1)^3 with respect to x. Omit the constant."
    answer: "(2*x + 1)**4/8"
    probes: [usub_forgets_du]
    # The question says to omit the constant, so an expanded answer that drops
    # it is equally correct — compare derivatives, not expressions.
    params: { without_du: "(2*x + 1)**4/4", up_to_constant: true }
