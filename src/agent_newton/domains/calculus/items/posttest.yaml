# Post-test bank: parallel forms of the pre-test items — same structure,
# different numbers. Held out from practice and administered without hints.
items:
  - id: ca_lim_post1
    concept_id: limits_of_sequences
    bank: posttest
    prompt: "Evaluate: lim(x -> 5) of (x^2 - 25)/(x - 5)"
    answer: "10"
    probes: [indeterminate_limit_reported_as_zero]
    params: { indeterminate: true }

  - id: ca_avg_post1
    concept_id: average_rate_of_change
    bank: posttest
    prompt: "For y = x^2, find the average rate of change from x = 3 to x = 7."
    answer: "10"
    probes: [rate_as_difference_not_ratio]
    params: { difference: 40 }

  - id: ca_tan_post1
    concept_id: limit_concept
    bank: posttest
    prompt: "Find the gradient of the tangent to y = x^2 at x = 6."
    answer: "12"
    probes: [tangent_as_secant]
    params: { secant_gradient: 13 }

  - id: ca_inst_post1
    concept_id: instantaneous_rate_of_change
    bank: posttest
    prompt: "For y = x^2, find the instantaneous rate of change at x = 5."
    answer: "10"
    probes: [average_for_instantaneous_rate]
    params: { average_rate: 11 }

  - id: ca_fp_post1
    concept_id: derivative_from_first_principles
    bank: posttest
    prompt: "Expand (a + h)^2."
    answer: "a**2 + 2*a*h + h**2"
    probes: [binomial_middle_term_lost]
    params: { base: "a", step: "h", exponent: 2 }

  - id: ca_pow_post1
    concept_id: power_rule
    bank: posttest
    prompt: "Differentiate: y = x^9"
    answer: "9*x**8"
    probes: [power_rule_forgets_decrement]
    params: { coefficient: 1, exponent: 9 }

  - id: ca_neg_post1
    concept_id: negative_fractional_exponents
    bank: posttest
    prompt: "Differentiate: y = 5/x^2"
    answer: "-10/x**3"
    probes: [reciprocal_power_not_rewritten]
    params: { coefficient: 5, exponent: 2 }

  - id: ca_poly_post1
    concept_id: polynomial_differentiation
    bank: posttest
    prompt: "Differentiate: y = 3x^3 - 2x^2 + 7"
    answer: "9*x**2 - 4*x"
    probes: [constant_term_differentiated]
    params: { constant: 7 }

  - id: ca_stat_post1
    concept_id: stationary_points
    bank: posttest
    prompt: "Solve 4x^2 - 12x = 0. Give all solutions."
    answer: "0, 3"
    probes: [cancel_x_loses_root]
    params: { nonzero_root: 3 }

  - id: ca_prod_post1
    concept_id: product_rule
    bank: posttest
    prompt: "Differentiate: y = x^4 sin(x)"
    answer: "4*x**3*sin(x) + x**4*cos(x)"
    probes: [product_rule_as_product_of_derivatives]
    params: { f: "x**4", g: "sin(x)", df: "4*x**3", dg: "cos(x)" }

  - id: ca_quot_post1
    concept_id: quotient_rule
    bank: posttest
    prompt: "Differentiate: y = x^2/(x + 3)"
    answer: "(2*x*(x + 3) - x**2)/(x + 3)**2"
    probes: [quotient_rule_order_swapped]
    params: { f: "x**2", g: "x + 3", df: "2*x", dg: "1" }

  - id: ca_chain_post1
    concept_id: chain_rule
    bank: posttest
    prompt: "Differentiate: y = sin(x^4)"
    answer: "4*x**3*cos(x**4)"
    probes: [chain_rule_omits_inner]
    params: { outer_derivative: "cos(x**4)" }

  - id: ca_impl_post1
    concept_id: implicit_differentiation
    bank: posttest
    prompt: "Given x^2 + y^2 = 49, find dy/dx."
    answer: "-x/y"
    probes: [implicit_diff_omits_dydx]
    params: { without_dydx: "-x" }

  - id: ca_anti_post1
    concept_id: antiderivative
    bank: posttest
    prompt: "Find the general antiderivative of 5x^4."
    answer: "x**5 + C"
    probes: [antiderivative_omits_constant]
    params: { particular: "x**5" }

  - id: ca_usub_post1
    concept_id: integration_by_substitution
    bank: posttest
    prompt: "Integrate cos(4x) with respect to x. Omit the constant."
    answer: "sin(4*x)/4"
    probes: [usub_forgets_du]
    params: { without_du: "sin(4*x)" }
